name: Android Device Verification

on:
  workflow_dispatch:
    inputs:
      run_baseline_profile:
        description: "Run baseline profile instrumentation"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  android-device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - uses: gradle/actions/setup-gradle@v6

      - name: Create emulator
        run: |
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name ai-chat-api-35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_6"

      - name: Start emulator
        run: |
          "$ANDROID_HOME/emulator/emulator" \
            -avd ai-chat-api-35 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            > emulator.log 2>&1 &
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          boot_completed=""
          until [ "$boot_completed" = "1" ]; do
            boot_completed=$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            sleep 5
          done
          "$ANDROID_HOME/platform-tools/adb" shell input keyevent 82

      - name: Run connected device tests
        run: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Run baseline profile instrumentation
        if: ${{ inputs.run_baseline_profile == 'true' }}
        run: ./gradlew :baselineprofile:connectedNonMinifiedReleaseAndroidTest --no-daemon --stacktrace

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-reports
          if-no-files-found: warn
          path: |
            emulator.log
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            baselineprofile/build/reports/androidTests/
            baselineprofile/build/outputs/androidTest-results/
