name: Release Android

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.11.0"
        required: true
      release_name:
        description: "Release title"
        required: true
      release_notes:
        description: "Markdown release notes. Leave blank to use generated notes."
        required: false

permissions:
  contents: write

jobs:
  release-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify release version
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          version_name=$(grep -E 'versionName = "[^"]+"' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          expected_tag="v${version_name}"
          if [ "$TAG_NAME" != "$expected_tag" ]; then
            echo "Release tag $TAG_NAME does not match Android version $expected_tag" >&2
            exit 1
          fi

      - name: Run Android checks
        run: ./gradlew testDebugUnitTest lint assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare release assets
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          apk_name="ai-chat-${TAG_NAME#v}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk_name"
          echo "APK_PATH=$apk_name" >> "$GITHUB_ENV"

          if [ -n "$RELEASE_NOTES" ]; then
            printf "%s\n" "$RELEASE_NOTES" > release-notes.md
          else
            cat > release-notes.md <<'EOF'
          - Android build generated by GitHub Actions.
          - Artifact type: installable debug APK. A release APK is not published because no formal signing config is configured.
          - Validation: testDebugUnitTest, lint, assembleDebug, assembleRelease.
          EOF
          fi

      - name: Verify release APK asset
        run: |
          set -euo pipefail
          case "$APK_PATH" in
            *release-unsigned*)
              echo "Refusing to publish unsigned release APK: $APK_PATH" >&2
              exit 1
              ;;
          esac
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: ${{ env.APK_PATH }}

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$RELEASE_NAME" --notes-file release-notes.md
            gh release upload "$TAG_NAME" "$APK_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$APK_PATH" --title "$RELEASE_NAME" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi
