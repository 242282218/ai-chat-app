name: Gateway

on:
  push:
    paths:
      - "gateway/**"
      - "contracts/gateway/**"
      - ".github/workflows/gateway.yml"
  pull_request:
    paths:
      - "gateway/**"
      - "contracts/gateway/**"
      - ".github/workflows/gateway.yml"

jobs:
  gateway:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache-dependency-path: gateway/go.mod

      - name: Run gateway tests
        working-directory: gateway
        run: |
          set -o pipefail
          go test ./... | tee ../gateway-test.log

      - name: Run gateway race tests
        working-directory: gateway
        run: |
          set -o pipefail
          go test -race ./... | tee ../gateway-race-test.log

      - name: Run go vet
        working-directory: gateway
        run: go vet ./...

      - name: Run govulncheck
        working-directory: gateway
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Upload gateway reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gateway-reports
          path: |
            gateway-test.log
            gateway-race-test.log
