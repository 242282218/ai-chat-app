name: Gateway

on:
  push:
    paths:
      - "gateway/**"
      - "contracts/gateway/**"
      - ".github/workflows/gateway.yml"
  pull_request:
    paths:
      - "gateway/**"
      - "contracts/gateway/**"
      - ".github/workflows/gateway.yml"

jobs:
  gateway:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: gateway/go.mod

      - name: Run gateway tests
        working-directory: gateway
        run: go test ./...

      - name: Run gateway race tests
        working-directory: gateway
        run: go test -race ./...

      - name: Run go vet
        working-directory: gateway
        run: go vet ./...

      - name: Run govulncheck
        working-directory: gateway
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
