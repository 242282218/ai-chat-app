name: Android

on:
  push:
    paths:
      - "app/**"
      - "baselineprofile/**"
      - "contracts/gateway/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android.yml"
      - ".github/workflows/release-android.yml"
  pull_request:
    paths:
      - "app/**"
      - "baselineprofile/**"
      - "contracts/gateway/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android.yml"
      - ".github/workflows/release-android.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      AI_CHAT_PROVIDER_BASE_URL: ${{ secrets.AI_CHAT_PROVIDER_BASE_URL }}
      AI_CHAT_PROVIDER_API_KEY: ${{ secrets.AI_CHAT_PROVIDER_API_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Run Android checks
        run: ./gradlew testDebugUnitTest lint assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-build-artifacts
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
